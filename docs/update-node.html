<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Fleet · Updating a Node</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; padding: 0 1.25rem; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 860px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Updating a Node — every exit leaves the machine as it was</h1>

    <svg viewBox="0 0 960 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="update-title update-desc">
      <title id="update-title">Updating a Node — every exit leaves the machine as it was</title>
      <desc id="update-desc">Flowchart of the Host-driven node update: a node running sessions is refused, the checkout is pulled fast-forward only, an unchanged HEAD skips the restart, npm install and the node build both run before anything is torn down, and only a successful build leads to exit status 75 and a supervisor restart. All three refusal paths end at the same terminal, where the node keeps running the code it already had.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="960" height="780" fill="#f5f5f5"/>

      <!-- ============ Arrows first (behind shapes) ============ -->

      <!-- start -> diamond A -->
      <line x1="320" y1="88" x2="320" y2="110" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A no -> pull -->
      <line x1="320" y1="188" x2="320" y2="210" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- pull -> diamond B -->
      <line x1="320" y1="268" x2="320" y2="290" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B yes -> build -->
      <line x1="320" y1="368" x2="320" y2="390" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- build -> diamond C -->
      <line x1="320" y1="448" x2="320" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C yes -> exit 75 (accent, the happy path) -->
      <line x1="320" y1="548" x2="320" y2="570" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- exit 75 -> end -->
      <line x1="320" y1="628" x2="320" y2="650" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- A yes -> shared refusal, outer lane x=770 -->
      <path d="M 398,152 H 762 Q 770,152 770,160 V 650"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B no -> shared refusal, middle lane x=710 -->
      <path d="M 398,330 H 702 Q 710,330 710,338 V 650"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C no -> shared refusal, inner lane x=650 -->
      <path d="M 398,510 H 642 Q 650,510 650,518 V 650"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ============ Arrow labels ============ -->
      <rect x="330" y="186" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO · IDLE</text>

      <rect x="330" y="366" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES · HEAD MOVED</text>

      <rect x="330" y="546" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="330" y="555" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES</text>

      <rect x="430" y="126" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="430" y="135" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YES · AGENTS IN FLIGHT</text>

      <rect x="430" y="304" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="430" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO · ALREADY CURRENT</text>

      <rect x="430" y="484" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="430" y="493" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO · BUILD FAILED</text>

      <!-- ============ Shapes ============ -->

      <!-- Start -->
      <rect x="220" y="48" width="200" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="220" y="48" width="200" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="320" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Update this Node</text>
      <text x="320" y="79" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">host compares commits, not versions</text>

      <!-- Diamond A -->
      <polygon points="320,110 398,152 320,194 242,152" fill="#f5f5f5"/>
      <polygon points="320,110 398,152 320,194 242,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="150" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sessions</text>
      <text x="320" y="164" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">running?</text>

      <!-- Pull -->
      <rect x="210" y="210" width="220" height="58" rx="6" fill="#f5f5f5"/>
      <rect x="210" y="210" width="220" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="218" y="218" width="30" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="233" y="227" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="320" y="247" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">git pull --ff-only</text>
      <text x="320" y="261" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">a diverged tree stops here</text>

      <!-- Diamond B -->
      <polygon points="320,290 398,330 320,370 242,330" fill="#f5f5f5"/>
      <polygon points="320,290 398,330 320,370 242,330" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="334" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HEAD moved?</text>

      <!-- Build -->
      <rect x="210" y="390" width="220" height="58" rx="6" fill="#f5f5f5"/>
      <rect x="210" y="390" width="220" height="58" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="218" y="398" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="235" y="407" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NPM</text>
      <text x="320" y="427" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">install · build:node</text>
      <text x="320" y="441" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">before anything is torn down</text>

      <!-- Diamond C -->
      <polygon points="320,470 398,510 320,550 242,510" fill="#f5f5f5"/>
      <polygon points="320,470 398,510 320,550 242,510" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="514" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build succeeded?</text>

      <!-- Exit 75 (focal) -->
      <rect x="210" y="570" width="220" height="58" rx="6" fill="#f5f5f5"/>
      <rect x="210" y="570" width="220" height="58" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="218" y="578" width="42" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="239" y="587" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SUPER</text>
      <text x="320" y="607" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">exit 75 · supervisor restarts</text>
      <text x="320" y="621" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">the node never replaces itself</text>

      <!-- Success end -->
      <rect x="210" y="650" width="220" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="210" y="650" width="220" height="40" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="320" y="668" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">New build, same node id</text>
      <text x="320" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">placements and history come with it</text>

      <!-- Shared refusal end -->
      <rect x="590" y="650" width="280" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="590" y="650" width="280" height="40" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="730" y="668" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nothing is torn down</text>
      <text x="730" y="681" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">the node keeps the code it already had</text>

      <!-- Editorial callouts -->
      <text x="916" y="230" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">a refusal names the sessions in the way,</text>
      <text x="916" y="248" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">so you can stop them and go ahead</text>
      <path d="M 712 238 Q 558 200 404 158" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="402" cy="156" r="2" fill="#eb6c36"/>
      <text x="60" y="424" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">a checkout that</text>
      <text x="60" y="442" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">no longer compiles</text>
      <text x="60" y="460" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">never costs a node</text>
      <path d="M 176 436 Q 192 434 208 430" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="208" cy="430" r="2" fill="#2d3142"/>

      <!-- Legend strip -->
      <line x1="44" y1="722" x2="916" y2="722" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="44" y="738" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="44" y="756" width="20" height="12" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="766" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end</text>

      <rect x="180" y="756" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="766" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>

      <polygon points="296,756 308,762 296,768 284,762" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="316" y="766" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Guard</text>

      <rect x="400" y="756" width="20" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="428" y="766" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Restart handover</text>

      <line x1="580" y1="762" x2="608" y2="762" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="616" y="766" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Happy path</text>

      <line x1="740" y1="762" x2="768" y2="762" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="776" y="766" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Guarded exit</text>
    </svg>
  </div>
</body>
</html>
