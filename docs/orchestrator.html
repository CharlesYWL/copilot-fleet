<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Fleet · Orchestrator</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; padding: 0 1.25rem; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Orchestrator · Diagram Design</p>
    <h1>The orchestrator — dispatch, end the turn, be woken</h1>

    <svg viewBox="0 150 1000 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orchestrator-title orchestrator-desc">
      <title id="orchestrator-title">The orchestrator — dispatch, end the turn, be woken</title>
      <desc id="orchestrator-desc">Architecture diagram: a person asks a lead session, which reaches the Host through a bearer-scoped MCP tool surface; the tools write task state to SQLite, a pure scheduler reads a snapshot of it, and the orchestrator engine dispatches workers and wakes the lead with a summary once a worker's turn completes, closing the loop without the lead ever waiting.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect x="0" y="150" width="1000" height="400" fill="#f5f5f5"/>
      <rect x="0" y="150" width="1000" height="400" fill="url(#dots)" opacity="0.55"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <rect x="232" y="168" width="208" height="264" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="284" y="172" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="181" fill="rgba(45,49,66,0.72)" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">AGENTS · ON NODES</text>

      <rect x="496" y="168" width="464" height="264" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="664" y="172" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="728" y="181" fill="rgba(45,49,66,0.72)" font-size="7.5" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">FLEET HOST · DECIDES</text>

      <!-- Arrows first (behind boxes) -->
      <path d="M 176,220 H 240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 248,248 H 184" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <path d="M 424,232 H 504" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 688,232 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 856,264 V 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 768,384 H 696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 512,376 H 432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 424,400 H 504" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- The wake: the one loop this whole design exists to make cheap -->
      <path d="M 600,352 V 316 Q 600,308 592,308 H 344 Q 336,308 336,300 V 272"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="192" y="200" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASK</text>

      <rect x="188" y="256" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="265" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVIEW</text>

      <rect x="432" y="212" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="221" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL CALL</text>

      <rect x="696" y="212" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="728" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TASK STATE</text>

      <rect x="800" y="300" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="824" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SNAPSHOT</text>

      <rect x="704" y="364" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="728" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACTIONS</text>

      <rect x="444" y="356" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISPATCH</text>

      <rect x="440" y="408" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="417" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TURN DONE</text>

      <rect x="428" y="288" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="297" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAKE + SUMMARY</text>

      <!-- Node: Person (external) -->
      <rect x="48" y="200" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="200" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="56" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="70" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="112" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Person</text>
      <text x="112" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">conversation · tasks</text>

      <!-- Node: Lead session -->
      <rect x="248" y="200" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="200" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="256" y="208" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="274" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="336" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead session</text>
      <text x="336" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chats · never waits</text>

      <!-- Node: Workers -->
      <rect x="248" y="352" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="352" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="256" y="360" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="274" y="369" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="336" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workers</text>
      <text x="336" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 per step · no tools</text>

      <!-- Node: Fleet tools -->
      <rect x="512" y="200" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="200" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="520" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="534" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MCP</text>
      <text x="600" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fleet tools</text>
      <text x="600" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/mcp · bearer-scoped</text>

      <!-- Node: Run store -->
      <rect x="768" y="200" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="200" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="856" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run store</text>
      <text x="856" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">runs · steps · notes</text>

      <!-- Node: Scheduler -->
      <rect x="768" y="352" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="352" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="776" y="360" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="792" y="369" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PURE</text>
      <text x="856" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scheduler</text>
      <text x="856" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">planNextActions()</text>

      <!-- Node: Orchestrator engine (focal) -->
      <rect x="512" y="352" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="352" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="520" y="360" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="536" y="369" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="600" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orchestrator engine</text>
      <text x="600" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">events + 15s sweep</text>

      <!-- Legend strip -->
      <line x1="48" y1="452" x2="952" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="48" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="48" y="484" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="68" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal</text>

      <rect x="128" y="484" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="148" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Agent or service</text>

      <rect x="248" y="484" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="268" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">State</text>

      <rect x="328" y="484" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="348" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Person</text>

      <line x1="416" y1="490" x2="444" y2="490" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="452" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">The wake</text>

      <line x1="536" y1="490" x2="564" y2="490" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="572" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">MCP over HTTP</text>

      <line x1="684" y1="490" x2="712" y2="490" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="720" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Reports back</text>
    </svg>
  </div>
</body>
</html>
