<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot Fleet · Session lifecycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; padding: 0 1.25rem; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>A session's life — cancel keeps the process, stop ends it</h1>

    <svg viewBox="0 0 1080 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
      <title id="lifecycle-title">A session's life — cancel keeps the process, stop ends it</title>
      <desc id="lifecycle-desc">State machine for a Copilot Fleet session: queued, starting, running and idle form the live loop; cancel drops a turn and returns to idle while the process survives; stop is terminal. A Host restart parks every live session in offline, and a node that comes back without the session settles it as failed but resumable, from which Resume re-attaches through ACP session/load.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="1080" height="680" fill="#f5f5f5"/>

      <!-- ============ Transitions (behind states) ============ -->

      <line x1="54" y1="136" x2="88" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="192" y1="136" x2="264" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="368" y1="136" x2="440" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="544" y1="124" x2="636" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="644" y1="148" x2="552" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="740" y1="136" x2="844" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1002" y1="136" x2="1016" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- running -> cancelling -->
      <line x1="496" y1="162" x2="496" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- cancelling -> idle, hopping the host-restart lane -->
      <path d="M 544,306 H 656 a 8,8 0 0,1 16,0 H 700 Q 708,306 708,298 V 170"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- idle -> offline -->
      <line x1="664" y1="162" x2="664" y2="432" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- offline -> failed, resumable -->
      <line x1="644" y1="466" x2="504" y2="466" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- failed, resumable -> starting -->
      <path d="M 398,440 V 208 Q 398,200 390,200 H 328 Q 320,200 320,192 V 170"
            fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ============ Transition labels ============ -->
      <rect x="52" y="110" width="42" height="12" rx="2" fill="#f5f5f5"/>
      <text x="73" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CREATE</text>

      <rect x="192" y="110" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="228" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCHED</text>

      <rect x="370" y="110" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="404" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIRST PROMPT</text>

      <rect x="548" y="98" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="107" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TURN COMPLETE</text>

      <rect x="556" y="158" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="596" y="167" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FOLLOW-UP</text>

      <rect x="742" y="110" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="764" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STOP</text>

      <rect x="506" y="206" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="506" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CANCEL</text>

      <rect x="718" y="234" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="718" y="243" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">STOP REASON RETURNED</text>

      <rect x="540" y="374" width="114" height="12" rx="2" fill="#f5f5f5"/>
      <text x="654" y="383" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">HOST RESTART</text>

      <rect x="504" y="440" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="449" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CAME BACK WITHOUT IT</text>

      <rect x="278" y="292" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="388" y="301" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">RESUME · SESSION/LOAD</text>

      <!-- ============ States ============ -->

      <circle cx="48" cy="136" r="6" fill="#2d3142"/>

      <rect x="96" y="110" width="96" height="52" rx="8" fill="#f5f5f5"/>
      <rect x="96" y="110" width="96" height="52" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="144" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">queued</text>
      <text x="144" y="149" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">capacity checked</text>

      <rect x="272" y="110" width="96" height="52" rx="8" fill="#f5f5f5"/>
      <rect x="272" y="110" width="96" height="52" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">starting</text>
      <text x="320" y="149" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">acp handshake</text>

      <rect x="448" y="110" width="96" height="52" rx="8" fill="#f5f5f5"/>
      <rect x="448" y="110" width="96" height="52" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="496" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">running</text>
      <text x="496" y="149" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">one turn at a time</text>

      <rect x="644" y="110" width="96" height="52" rx="8" fill="#f5f5f5"/>
      <rect x="644" y="110" width="96" height="52" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="692" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">idle</text>
      <text x="692" y="149" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">process alive</text>

      <rect x="852" y="110" width="150" height="52" rx="8" fill="#f5f5f5"/>
      <rect x="852" y="110" width="150" height="52" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="927" y="134" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stopped · completed</text>
      <text x="927" y="149" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">from any live state</text>

      <circle cx="1024" cy="136" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <circle cx="1024" cy="136" r="5" fill="#2d3142"/>

      <rect x="448" y="272" width="96" height="52" rx="8" fill="#f5f5f5"/>
      <rect x="448" y="272" width="96" height="52" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="496" y="296" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">cancelling</text>
      <text x="496" y="311" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">process survives</text>

      <rect x="644" y="440" width="96" height="52" rx="8" fill="#f5f5f5"/>
      <rect x="644" y="440" width="96" height="52" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="692" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">offline</text>
      <text x="692" y="479" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">awaiting inventory</text>

      <rect x="300" y="440" width="204" height="52" rx="8" fill="#f5f5f5"/>
      <rect x="300" y="440" width="204" height="52" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="402" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">failed · resumable</text>
      <text x="402" y="479" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">agent id on record &#8594; Resume</text>

      <!-- Editorial callout -->
      <text x="1036" y="546" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">a node that still holds the session</text>
      <text x="1036" y="564" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">goes straight back to running or idle</text>
      <path d="M 880 532 Q 812 512 744 482" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="744" cy="482" r="2" fill="#2d3142"/>

      <!-- Legend strip -->
      <line x1="44" y1="606" x2="1036" y2="606" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="44" y="622" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="44" y="640" width="20" height="12" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="72" y="650" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Live state</text>

      <rect x="180" y="640" width="20" height="12" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="208" y="650" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transient</text>

      <rect x="320" y="640" width="20" height="12" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="348" y="650" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Terminal</text>

      <rect x="456" y="640" width="20" height="12" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="484" y="650" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Recoverable</text>

      <line x1="620" y1="646" x2="648" y2="646" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="656" y="650" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Recovery path</text>

      <line x1="800" y1="646" x2="828" y2="646" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="836" y="650" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Not the operator's doing</text>
    </svg>
  </div>
</body>
</html>
